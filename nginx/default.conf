upstream django {
    server web:8000;
}

# --- HTTP: ACME challenge + HTTPS'ga yo'naltirish ---
server {
    listen 80;
    server_name booking.giyosdev.uz;

    # Let's Encrypt webroot tekshiruvi shu manzildan o'tadi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    server_name booking.giyosdev.uz;

    ssl_certificate     /etc/letsencrypt/live/booking.giyosdev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.giyosdev.uz/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}