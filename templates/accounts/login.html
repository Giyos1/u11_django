{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}
    login
{% endblock %}

{% block main %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-lg">
                    <div class="card-body">

                        <h4 class="text-center mb-4">📘login oynasi</h4>
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}

                            <div class="d-grid mt-4 p-21">
                                <button type="submit" class="btn btn-success btn-lg">
                                    login
                                </button>
                                <button><a href="{% url 'password_reset' %}">Forgot Password</a></button>
                            </div>
                        </form>

                        {#                        <a href="{% provider_login_url 'google' %}"#}
                        <a href="{% url 'google_redirect' %}"
                           class="google-btn">
                            <img src="https://s3-alpha.figma.com/hub/file/6055265191/97a0b7ac-13bb-4f59-986e-8c3e960435fd-cover.png"
                                 style="width: 100px" alt="Google">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>


{% endblock %}
